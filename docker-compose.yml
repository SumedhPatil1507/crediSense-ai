services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: credisense
      POSTGRES_USER: credisense
      POSTGRES_PASSWORD: credisense-local-only
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credisense -d credisense"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.7.0
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes: ["kafka_data:/var/lib/kafka/data"]

  feast-init:
    build: .
    command: feast apply
    env_file: .env
    environment:
      FEAST_REDIS_CONNECTION_STRING: redis:6379
    volumes: [".:/app"]
    depends_on:
      redis:
        condition: service_healthy

  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://credisense:credisense-local-only@postgres:5432/credisense
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - .:/app

  consumer:
    build: .
    command: python -m src.streaming.kafka_consumer
    env_file: .env
    environment:
      DATABASE_URL: postgresql://credisense:credisense-local-only@postgres:5432/credisense
      REDIS_URL: redis://redis:6379/0
      FEAST_REDIS_CONNECTION_STRING: redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes: [".:/app"]
    ports: ["9108:9108"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      feast-init:
        condition: service_completed_successfully

  streamlit:
    build: .
    command: streamlit run app/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      CREDISENSE_LIVE_FEATURES_URL: http://api:8000/api/v1/features/events
      CREDISENSE_LIVE_FEATURES_TOKEN: ${API_SECRET_KEY}
    volumes:
      - .:/app
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  kafka_data:
